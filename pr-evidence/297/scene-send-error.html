<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Feedback send error</title>
    <link rel="stylesheet" href="../../apps/desktop/src/styles/tokens.css" />
    <link rel="stylesheet" href="../../apps/desktop/src/styles/app.css" />
    <link rel="stylesheet" href="../../apps/desktop/src/settings/settings.css" />
    <link rel="stylesheet" href="./evidence-shared.css" />
  </head>
  <body>
    <div class="stage">
      <div class="st-dlg-scrim">
        <div class="st-dlg st-dlg--feedback" role="dialog">
          <h2 class="st-h2">Send feedback</h2>
          <label class="st-row st-row--stack">
            <span class="st-row__k"
              >Description<span aria-hidden="true"> *</span
              ><span class="visually-hidden">required</span></span
            >
            <textarea class="st-inp st-inp--area" rows="6">Still here after failure</textarea>
          </label>
          <div class="st-field-error st-field-error--block" role="alert">
            <p>Couldn't reach the feedback server. Check your internet connection and try again.</p>
            <button type="button" class="st-btn st-btn--link">Try again</button>
          </div>
          <div class="st-dlg__actions">
            <button type="button" class="st-btn">Cancel</button>
            <button type="button" class="st-btn st-btn--primary">Send</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
