<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Import progress</title>
    <link rel="stylesheet" href="../../apps/desktop/src/styles/tokens.css" />
    <link rel="stylesheet" href="../../apps/desktop/src/shells/shells.css" />
    <link rel="stylesheet" href="./evidence-shared.css" />
    <style>
      .op {
        max-width: 560px;
        margin: 0 auto;
        padding: 44px;
        border: 1px solid var(--ct-border);
        border-radius: var(--ct-radius-lg);
        background: var(--ct-surface-raised);
        box-shadow: var(--ct-elevation-2);
        text-align: center;
      }
      .op__title {
        margin: var(--ct-space-4) 0 var(--ct-space-2);
        font-size: var(--ct-text-xl);
        font-weight: var(--ct-weight-semibold);
      }
      .op__text {
        margin: 0;
        color: var(--ct-text-muted);
        font-size: var(--ct-text-sm);
      }
      .op__bar {
        height: 10px;
        margin: var(--ct-space-6) 0 var(--ct-space-3);
        border-radius: var(--ct-radius-full);
        background: var(--ct-border);
        overflow: hidden;
        position: relative;
      }
      .op__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--ct-accent);
        animation: op-slide 1.2s ease-in-out infinite;
      }
      @keyframes op-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      .op__cancel {
        margin-top: var(--ct-space-4);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <section class="op" role="status" aria-live="polite" aria-busy="true">
        <h2 class="op__title">Importing “Kim Draft.docx”…</h2>
        <p class="op__text">
          Getting your chapters ready from Word. This can take a minute for a long book.
        </p>
        <div class="op__bar"></div>
        <button type="button" class="op__cancel sh-btn sh-btn--secondary">Cancel</button>
      </section>
    </div>
  </body>
</html>
