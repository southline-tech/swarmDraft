<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Book menu Import vs Open</title>
    <link rel="stylesheet" href="../../apps/desktop/src/styles/tokens.css" />
    <link rel="stylesheet" href="../../apps/desktop/src/shells/shells.css" />
    <link rel="stylesheet" href="./evidence-shared.css" />
  </head>
  <body>
    <div class="stage">
      <nav class="menu-demo sh-menu" aria-label="Book menu">
        <button type="button" class="sh-mi">New <span class="sh-k">Ctrl+N</span></button>
        <button type="button" class="sh-mi">Open <span class="sh-k">Ctrl+O</span></button>
        <button type="button" class="sh-mi" style="background: var(--ct-selected-bg)">Import…</button>
        <button type="button" class="sh-mi">Recent <span class="sh-k">›</span></button>
        <div class="sh-sep" role="separator"></div>
        <button type="button" class="sh-mi">Settings <span class="sh-k">Ctrl+,</span></button>
      </nav>
    </div>
  </body>
</html>
