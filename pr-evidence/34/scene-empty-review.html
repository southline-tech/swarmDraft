<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Review empty state (ob8)</title>
    <link rel="stylesheet" href="../../apps/desktop/src/styles/tokens.css" />
    <link rel="stylesheet" href="../../apps/desktop/src/styles/app.css" />
    <link rel="stylesheet" href="./evidence-shared.css" />
    <style>
      .panel {
        width: var(--ct-panel-w, 18rem);
        padding: var(--ct-space-4);
        border: 1px solid var(--ct-border);
        border-radius: var(--ct-radius-lg);
        background: var(--ct-surface);
      }
      .es h3 {
        margin: 0 0 var(--ct-space-2);
        font-size: var(--ct-text-md);
      }
      .es p {
        margin: 0;
        color: var(--ct-text-muted);
        font-size: var(--ct-text-sm);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <aside class="panel">
        <div class="es" data-test="empty-review">
          <h3>Nothing to review</h3>
          <p>
            When your writing assistant suggests a change, it will show up here for you to keep or
            skip.
          </p>
        </div>
      </aside>
    </div>
  </body>
</html>
