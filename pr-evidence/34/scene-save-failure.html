<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save failure banner (RAD-271 / ob9)</title>
    <link rel="stylesheet" href="../../apps/desktop/src/styles/tokens.css" />
    <link rel="stylesheet" href="../../apps/desktop/src/styles/app.css" />
    <link rel="stylesheet" href="../../apps/desktop/src/shells/shells.css" />
    <link rel="stylesheet" href="./evidence-shared.css" />
  </head>
  <body>
    <div class="stage">
      <section class="ec ec--danger ec--banner" data-test="save-failure-banner">
        <span class="ec__icon" aria-hidden="true">!</span>
        <div class="ec__body">
          <h3 class="ec__title">Your latest changes aren't saved yet</h3>
          <p class="ec__text">
            Don't close swarmDraft. We'll keep trying, or save a copy somewhere else now.
          </p>
        </div>
        <button type="button" class="sh-btn sh-btn--primary">Save a copy</button>
      </section>
    </div>
  </body>
</html>
