name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20.19.2'
  PNPM_VERSION: '9.15.0'
  RUST_TOOLCHAIN: '1.99.1'

jobs:
  windows-installer:
    name: Windows signed installer and updater
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-version.mjs --tag ${{ github.ref_name }}

      - name: Build NSIS and MSI (signed updater artifacts)
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: swarmDraft ${{ github.ref_name }}
          releaseBodyPath: docs/release-notes-template.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi

      - name: SHA256 checksums
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          $files = @(
            Get-ChildItem "$bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue
            Get-ChildItem "$bundle/msi/*.msi" -ErrorAction SilentlyContinue
          ) | Where-Object { $_ }
          if (-not $files) { throw "No installer bundles found under $bundle" }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload SHA256SUMS to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          files: SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swarmdraft-windows-${{ github.ref_name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.sig
            SHA256SUMS.txt
          retention-days: 14
