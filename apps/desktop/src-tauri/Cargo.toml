[package]
name = "coauthor"
version = "0.1.0"
description = "coAuthor desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "coauthor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
