<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>#179 overlap evidence</title>
    <link rel="stylesheet" href="../../apps/desktop/src/styles/tokens.css" />
    <link rel="stylesheet" href="../../apps/desktop/src/styles/app.css" />
    <link rel="stylesheet" href="../../apps/desktop/src/shells/shells.css" />
    <style>
      body {
        font-family: var(--ct-font-ui);
        background: var(--ct-bg);
        color: var(--ct-text);
        padding: var(--ct-space-6);
        display: flex;
        flex-direction: column;
        gap: var(--ct-space-8);
      }
      h1 {
        font-size: var(--ct-text-lg);
      }
      h2 {
        font-size: var(--ct-text-md);
        color: var(--ct-text-muted);
      }
      .panel {
        max-width: 24rem;
        padding: var(--ct-space-4);
        background: var(--ct-surface);
        border: 1px solid var(--ct-border);
        border-radius: var(--ct-radius-md);
      }
      .card {
        border: 1px solid var(--ct-border);
        border-left: 3px solid var(--ct-text-muted);
        border-radius: var(--ct-radius-md);
        padding: var(--ct-space-3);
        opacity: 0.72;
        color: var(--ct-text-muted);
      }
      .sample {
        position: relative;
        font-family: var(--ct-font-manuscript);
        padding-left: 1.5rem;
      }
      .sample [data-suggester] {
        --ct-suggester: var(--ct-suggest-overlap);
        text-decoration: underline 2px var(--ct-suggest-overlap);
      }
    </style>
  </head>
  <body>
    <h1>Tracked-change overlap (#179)</h1>
    <section>
      <h2>ov2 — gutter dot (single-author view)</h2>
      <div class="sample">
        <button
          type="button"
          class="suggest-overlap-gutter"
          aria-label="1 more suggestion from Continuity"
        ></button>
        <span data-suggester style="--ct-suggester: var(--ct-collab-1)">word</span>
      </div>
    </section>
    <section>
      <h2>ov3 — All-view overlap + badge</h2>
      <div class="sample" style="padding-left: 0">
        <span class="suggest-overlap" data-suggest-overlap><span data-suggester>word</span></span
        ><button
          type="button"
          class="suggest-overlap-badge"
          aria-label="2 suggestions, by Mara and Continuity"
        >
          2
        </button>
      </div>
      <div class="sh-menu overlap-popover panel" role="dialog" aria-label="Overlapping suggestions">
        <p><strong>Continuity</strong> · dimmed</p>
        <p><strong>Mara</strong> · guttered</p>
      </div>
    </section>
    <section>
      <h2>ov4 — outdated card</h2>
      <div class="panel card">
        <p><strong>Continuity</strong> · outdated suggestion</p>
        <button type="button" class="sh-btn">Dismiss</button>
      </div>
    </section>
  </body>
</html>
