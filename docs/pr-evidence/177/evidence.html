<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>#177 view switcher evidence</title>
    <link rel="stylesheet" href="../../apps/desktop/src/styles/tokens.css" />
    <style>
      body {
        font-family: var(--ct-font-ui);
        background: var(--ct-bg);
        color: var(--ct-text);
        padding: var(--ct-space-6);
      }
      .view-switcher {
        display: flex;
        flex-direction: column;
        gap: var(--ct-space-1);
        max-width: 22rem;
      }
      .lbl {
        font-size: var(--ct-text-xs);
        font-weight: var(--ct-weight-semibold);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ct-text-muted);
      }
      .view-opt {
        display: flex;
        align-items: center;
        gap: var(--ct-space-2);
        min-height: var(--ct-space-12);
        padding: 0 var(--ct-space-2);
        border: 1px solid var(--ct-border);
        border-radius: var(--ct-radius-md);
        background: var(--ct-surface);
      }
      .view-opt.sel {
        background: var(--ct-selected-bg);
        font-weight: var(--ct-weight-semibold);
      }
      .av {
        width: 24px;
        height: 24px;
        border-radius: var(--ct-radius-full);
        background: var(--ct-suggester);
        color: var(--ct-accent-contrast);
        display: grid;
        place-items: center;
        font-size: var(--ct-text-sm);
      }
      .cnt {
        margin-left: auto;
        color: var(--ct-text-muted);
      }
    </style>
  </head>
  <body>
    <h1>Per-author view switcher (sample)</h1>
    <div class="view-switcher" role="radiogroup" aria-label="Show changes from">
      <div class="lbl">Show changes from</div>
      <div class="view-opt sel" role="radio" aria-checked="true">
        <span>All</span><span class="cnt">(5)</span>
      </div>
      <div
        class="view-opt"
        role="radio"
        aria-checked="false"
        style="--ct-suggester: var(--ct-collab-1)"
      >
        <span class="av">L</span><span>Line Editor</span><span class="cnt">(3)</span>
      </div>
      <div
        class="view-opt"
        role="radio"
        aria-checked="false"
        style="--ct-suggester: var(--ct-collab-2)"
      >
        <span class="av">C</span><span>Continuity</span><span class="cnt">(2, 1 outdated)</span>
      </div>
    </div>
    <p>Use devtools to toggle <code>data-theme</code> on <code>html</code> for dark captures.</p>
  </body>
</html>
